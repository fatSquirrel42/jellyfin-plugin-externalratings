name: '🔬 Run CodeQL'

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  schedule:
    - cron: '24 2 * * 4'
  workflow_dispatch:

jobs:
  call:
    # Code scanning upload requires code scanning to be enabled, which needs a PUBLIC repo (CodeQL is
    # free for public repos; private repos need GitHub Advanced Security, unavailable on personal
    # accounts). While this repo is private the scan can't upload, so skip the job entirely instead of
    # failing. When the repo is made public this guard becomes true and CodeQL runs again with no
    # further changes.
    if: ${{ github.event.repository.visibility == 'public' }}
    # The reusable workflow declares no permissions, so the called job runs with the repo's
    # (restrictive) default GITHUB_TOKEN. CodeQL's analyze step needs these to upload SARIF and read
    # the workflow run — without them the scan runs but fails at the end with
    # "Resource not accessible by integration". Grant them at the caller job level.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/scan-codeql.yaml@master
    with:
      repository-name: fatSquirrel42/jellyfin-plugin-externalratings

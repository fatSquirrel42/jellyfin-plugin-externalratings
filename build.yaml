version: "1.0.0.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Resolves external community ratings (IMDb, or MyAnimeList and eight more via mdblist) into Jellyfin's CommunityRating field."
description: >
  Server-side plugin that resolves the community score of an external source and writes it
  into Jellyfin's standard CommunityRating field - natively visible on all clients including
  TV apps, without any web-UI hacks. IMDb is served from a local copy of IMDb's own dataset
  files, with no API key and no request quota, and covers movies, series, seasons and
  episodes. MyAnimeList and eight other sources come through mdblist and need a free API key.
category: "Metadata"
owner: "fatSquirrel42"
artifacts:
- "Jellyfin.Plugin.ExternalRatings.dll"
changelog: |
  Requires Jellyfin 12.0 or newer. On Jellyfin 10.11.x stay on 0.2.0.0 - this build cannot load there.
  - Rebuilt for Jellyfin 12.0, which runs on .NET 10. A plugin compiled against 10.11.x is binary
    incompatible with a 12.0 server, so this release is offered only to servers running 12.0 or newer.
    Servers on 10.11.x keep seeing 0.2.0.0 as their newest installable version.
  - No functional changes. Sources, item levels, episode and season matching, the budget and cache
    behaviour and the configuration page all work exactly as in 0.2.0.0.
